[project]
name = "weather-structured-agent"
version = "0.1.0"
description = "Deterministic weather agent parsing unstructured queries into strict live Open-Meteo payloads"
requires-python = ">=3.10"
dependencies = [
    "instructor>=1.7.0",
    "openai>=1.50.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
